name: Build MotoGP 08 Android Port

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle Fast
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
        unzip -q gradle-8.0-bin.zip
        echo "$PWD/gradle-8.0/bin" >> $GITHUB_PATH

    - name: Generate Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.0
        fi
        chmod +x gradlew

    - name: Download and Setup Android NDK r26b
      run: |
        echo "Downloading Android NDK..."
        wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
        unzip -q android-ndk-r26b-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV
        echo "NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV

    - name: Configure local.properties for NDK
      run: |
        echo "ndk.dir=$PWD/android-ndk-r26b" > local.properties

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
