name: Build MotoGP 08 Android Port

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        run: |
          echo "Downloading Android NDK r26b..."
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV
          echo "NDK Home: $PWD/android-ndk-r26b"

      - name: Verify Environment
        run: |
          echo "NDK Home: $ANDROID_NDK_HOME"
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version
          echo "Environment ready for cross-compilation!"
