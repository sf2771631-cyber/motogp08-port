name: Build MotoGP 08 Android Port

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Setup Android NDK r26b
      run: |
        echo "Downloading Android NDK..."
        wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
        unzip -q android-ndk-r26b-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV
        echo "NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV

    - name: Build APK with Gradle
      run: |
        chmod +x gradlew || true
        # If gradle wrapper doesn't exist, generate or use system gradle
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
